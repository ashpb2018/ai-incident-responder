[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "incident-sentinel"
version = "0.1.0"
description = "Autonomous SRE agent that investigates PagerDuty/OpsGenie alerts with live observability data and writes a root-cause report."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Ash K" }]
keywords = ["sre", "incident-response", "llm", "ai-agent", "observability", "devops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
bedrock = ["boto3>=1.35.0"]
all = ["anthropic>=0.40.0", "boto3>=1.35.0"]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[project.scripts]
sentinel = "incident_sentinel.cli:main"

[project.urls]
Homepage = "https://github.com/ashpb2018/ai-incident-responder"
Repository = "https://github.com/ashpb2018/ai-incident-responder"

[tool.hatch.build.targets.wheel]
packages = ["src/incident_sentinel"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
# UP042: `str, Enum` is intentional for broad compatibility with pydantic .value semantics.
ignore = ["E501", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["src"]
asyncio_mode = "auto"
